[project]
name = "voice-bot"
version = "0.1.0"
description = "AI Sales Roleplay backend API"
authors = [
    {name = "schattaraj",email = "schattaraj200@gmail.com"}
]
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi (>=0.140.0,<0.141.0)",
    "uvicorn[standard] (>=0.51.0,<0.52.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "pyodbc (>=5.3.0,<6.0.0)",
    "anthropic (>=0.120.0,<0.121.0)",
    "openai (>=2.48.0,<3.0.0)",
    "deepgram-sdk (>=7.6.0,<8.0.0)",
    "elevenlabs (>=2.59.0,<3.0.0)"
]


[tool.poetry]
# This is an application, not a publishable library — don't try to build
# and install "voice-bot" itself as a package, just manage dependencies.
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx2 (>=2.9.1,<3.0.0)"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
